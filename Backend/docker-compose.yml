version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careplus_db
    environment:
      POSTGRES_USER: careplus_user
      POSTGRES_PASSWORD: careplus_pass
      POSTGRES_DB: careplus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - careplus_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: careplus_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@careplus.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - careplus_network

networks:
  careplus_network:
    driver: bridge

volumes:
  postgres_data:
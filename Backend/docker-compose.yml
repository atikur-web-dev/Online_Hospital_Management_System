version: '3.8'

services:
  # আপনার Backend App
  app:
    build: .
    container_name: careplus_backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}  # Neon URL from .env
      - NODE_ENV=development
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - careplus_network

  # Redis (Caching - Advanced Feature)
  redis:
    image: redis:7-alpine
    container_name: careplus_redis
    ports:
      - "6379:6379"
    networks:
      - careplus_network
    volumes:
      - redis_data:/data

  # pgAdmin (Neon DB দেখতে)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: careplus_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@careplus.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - careplus_network

networks:
  careplus_network:
    driver: bridge

volumes:
  redis_data: